<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hồ Bảo Linh abc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Tạo bản đồ nền và zoom vào vị trí Hồ Bảo Linh
    var map = L.map('map').setView([21.910388142247072, 105.58053963757321], 13);

    // Lớp nền OSM
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Thêm marker tại Hồ Bảo Linh
    L.marker([21.910388142247072, 105.58053963757321]).addTo(map)
      .bindPopup('<b>Hồ Bảo Linh</b>')
      .openPopup();

    // Load file GeoJSON nếu có
    fetch('hobaolinh.geojson')
      .then(res => res.json())
      .then(data => {
        var geoLayer = L.geoJSON(data, {
          style: {
            color: 'blue',
            weight: 1.5,
            fillColor: 'cyan',
            fillOpacity: 0.4
          },
          onEachFeature: function (feature, layer) {
            const name = feature.properties.VARNAME_3 || 'No name';
            layer.bindPopup(`<b>${name}</b>`);
          }
        }).addTo(map);

        map.fitBounds(geoLayer.getBounds());
      });
  </script>
</body>
</html>
